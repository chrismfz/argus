name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Advisory only until the tree-wide gofmt PR lands (ROADMAP Phase 0),
      # after which this becomes `make fmt` as a hard gate.
      - name: gofmt (advisory)
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "::warning::$(echo "$unformatted" | wc -l) file(s) need gofmt (advisory, not blocking):"
            echo "$unformatted"
          else
            echo "gofmt clean."
          fi

      - name: go vet
        run: make vet

      - name: go build
        run: go build ./...

      - name: go test
        run: make test
